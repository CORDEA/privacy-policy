name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pandoc/actions/setup@v1
        with:
          version: 2.19
      - run: |
          site_dir="$(mktemp -d)"
          pandoc -s -o "$site_dir/index.html" index.md policies/no-data.md

          find . -mindepth 2 -maxdepth 2 -name index.md -type f -print0 |
            while IFS= read -r -d '' source; do
              output="$site_dir/${source%.md}.html"
              mkdir -p "$(dirname "$output")"
              pandoc -s -o "$output" "$source" policies/no-data.md
            done

          mv "$site_dir" /tmp/privacy-policy-site
      - uses: actions/checkout@v4
        with:
          ref: pages
          clean: false
      - run: |
          git config user.name 'Yoshihiro Tanaka'
          git config user.email 'contact@cordea.jp'
          cp -R /tmp/privacy-policy-site/. ./
          git add -A .
          git commit -m 'update' && git push || true
